[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-forecasting"
version = "0.1.0"
description = "Forecasting Motion in the Wild"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "lightning>=2.0",
    "matplotlib>=3.7",
    "mediapy>=1.1",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scipy>=1.10",
    "timm>=0.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["motion_forecasting*"]
